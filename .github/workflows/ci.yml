name: CI

on:
  push:
    branches:
      - develop
      - main
      - master
      - 'copilot/**'
  pull_request:
    branches:
      - develop
      - main
      - master
      - 'copilot/**'
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parcel-volume-forecast

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest with report generation
        run: python scripts/run_tests_with_report.py -q

      - name: Publish unit test summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary_path = Path("reports/tests/latest/test_run_summary.json")
          step_summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          if not summary_path.exists():
              step_summary.write_text("## Unit test summary\n\nTest summary report was not generated.\n", encoding="utf-8")
              raise SystemExit(0)

          payload = json.loads(summary_path.read_text(encoding="utf-8"))
          markdown = f"""## Unit test summary

          - Status: **{payload.get("status", "unknown").upper()}**
          - Tests: **{payload.get("tests", 0)}**
          - Passed: **{payload.get("passed", 0)}**
          - Failures: **{payload.get("failures", 0)}**
          - Errors: **{payload.get("errors", 0)}**
          - Skipped: **{payload.get("skipped", 0)}**
          - Duration (s): **{payload.get("time", 0.0):.3f}**

          HTML and JSON reports are attached under workflow artifacts as `unit-test-report`.
          """
          with step_summary.open("a", encoding="utf-8") as fh:
              fh.write(markdown + "\n")
          PY

      - name: Upload unit test report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            parcel-volume-forecast/reports/tests/latest/test_run_summary.html
            parcel-volume-forecast/reports/tests/latest/test_run_summary.json
            parcel-volume-forecast/reports/tests/latest/junit.xml
          if-no-files-found: warn

  smoke:
    name: Forecast smoke check
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: parcel-volume-forecast

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run training smoke test
        run: |
          python src/training/train_xgboost.py \
            --experiment 'ci-smoke' \
            --dataset-version 'Logistics data input.csv' \
            --run-mode debug
